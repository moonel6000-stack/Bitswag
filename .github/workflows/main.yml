name: Build BitSwag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitswag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile BitSwag
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # Récupération du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dépendances Linux
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            git \
            perl \
            make \
            python3 \
            curl \
            ca-certificates \
            ldid \
            libzstd-dev \
            libtinfo6 \
            libxml2-dev \
            libssl-dev \
            cmake \
            unzip \
            xz-utils \
            dpkg-dev \
            fakeroot

      # Installation de Theos
      - name: Install Theos
        run: |
          git clone --depth 1 --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      # Installation du SDK iOS
      - name: Install iOS SDK
        run: |
          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          mkdir -p "$HOME/theos/sdks"

          SDK=$(find "$RUNNER_TEMP/theos-sdks" \
            -maxdepth 1 \
            -type d \
            -name 'iPhoneOS*.sdk' \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDK" ]; then
            echo "::error::iOS SDK not found"
            exit 1
          fi

          cp -R "$SDK" "$HOME/theos/sdks/"

      # Vérification Dobby
      - name: Check Dobby
        run: |
          if [ ! -f "$THEOS/vendor/include/dobby.h" ]; then
            echo "::error::dobby.h is missing"
            exit 1
          fi

          if [ ! -f "$THEOS/vendor/lib/libdobby.a" ]; then
            echo "::error::libdobby.a is missing"
            exit 1
          fi

          echo "Dobby files found"

      # Compilation
      - name: Clean project
        run: |
          make clean

      - name: Compile BitSwag
        run: |
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless

      # Publication du paquet
      - name: Upload BitSwag package
        uses: actions/upload-artifact@v4
        with:
          name: BitSwag-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
