name: Compile BitSwag
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build:
    name: Build BitSwag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            make \
            clang \
            build-essential \
            perl \
            python3 \
            libplist-dev \
            libssl-dev \
            lzma-dev \
            dpkg-dev \
            fakeroot \
            xz-utils \
            unzip
      - name: Install ldid from Procursus
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7
      - name: Verify ldid
        run: |
          command -v ldid
          ldid -h || true
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
      - name: Check Dobby files
        run: |
          if [ ! -f "$HOME/theos/vendor/include/dobby.h" ]; then
            echo "ERREUR : dobby.h est absent."
            exit 1
          fi
          if [ ! -f "$HOME/theos/vendor/lib/libdobby.a" ]; then
            echo "ERREUR : libdobby.a est absent."
            exit 1
          fi
      - name: Compile BitSwag
        run: |
          make clean || true
          make package FINALPACKAGE=1
      - name: Upload BitSwag package
        uses: actions/upload-artifact@v4
        with:
          name: BitSwag-deb
          path: packages/*.deb
          if-no-files-found: error
