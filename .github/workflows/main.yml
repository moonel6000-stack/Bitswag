name: Build BitSwag
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build:
    name: Build BitSwag
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew update
          brew install ldid dpkg cmake ninja
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone https://github.com/theos/sdks.git /tmp/theos-sdks
          find /tmp/theos-sdks \
            -maxdepth 1 \
            -type d \
            -name 'iPhoneOS*.sdk' \
            -exec cp -R {} "$HOME/theos/sdks/" \;
      - name: Compile Dobby for iOS ARM64
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
          mkdir -p "$THEOS/vendor/include"
          mkdir -p "$THEOS/vendor/lib"
          HEADER=$(find /tmp/Dobby -name dobby.h -type f | head -n 1)
          if [ -z "$HEADER" ]; then
            echo "ERREUR : dobby.h introuvable."
            exit 1
          fi
          cp "$HEADER" "$THEOS/vendor/include/dobby.h"
          cmake -S /tmp/Dobby -B /tmp/Dobby/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/Dobby/build-ios --config Release
          LIBRARY=$(find /tmp/Dobby/build-ios \
            -name 'libdobby.a' -type f | head -n 1)
          if [ -z "$LIBRARY" ]; then
            echo "ERREUR : bibliothèque Dobby iOS introuvable."
            find /tmp/Dobby/build-ios -type f
            exit 1
          fi
          cp "$LIBRARY" "$THEOS/vendor/lib/libdobby.a"
      - name: Verify Dobby
        run: |
          test -f "$THEOS/vendor/include/dobby.h"
          test -f "$THEOS/vendor/lib/libdobby.a"
          file "$THEOS/vendor/lib/libdobby.a"
          lipo -info "$THEOS/vendor/lib/libdobby.a"
      - name: Compile BitSwag
        run: |
          make clean || true
          make package FINALPACKAGE=1
      - name: Upload BitSwag package
        uses: actions/upload-artifact@v4
        with:
          name: BitSwag-deb
          path: packages/*.deb
          if-no-files-found: error
