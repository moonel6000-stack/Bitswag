name: Build BitSwag

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build BitSwag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            make \
            clang \
            build-essential \
            perl \
            python3 \
            cmake \
            ninja-build \
            libplist-dev \
            libssl-dev \
            lzma-dev \
            dpkg-dev \
            fakeroot \
            xz-utils \
            unzip

      - name: Install ldid from Procursus
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      - name: Verify ldid
        run: |
          command -v ldid
          ldid -h || true

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          if ! compgen -G "$HOME/theos/sdks/iPhoneOS*.sdk" > /dev/null; then
            git clone https://github.com/theos/sdks.git /tmp/theos-sdks

            find /tmp/theos-sdks \
              -maxdepth 1 \
              -type d \
              -name 'iPhoneOS*.sdk' \
              -exec cp -R {} "$HOME/theos/sdks/" \;
          fi

          ls -la "$HOME/theos/sdks"

      - name: Download Dobby source
        run: |
          git clone --depth 1 \
            https://github.com/jmpews/Dobby.git \
            /tmp/Dobby

          echo "Dobby source downloaded."

      - name: Check Dobby iOS library
        run: |
          if [ ! -f "$THEOS/vendor/include/dobby.h" ]; then
            echo "ERREUR : dobby.h absent."
            exit 1
          fi

          if [ ! -f "$THEOS/vendor/lib/libdobby.a" ]; then
            echo "ERREUR : libdobby.a iOS ARM64 absente."
            echo "Une bibliothèque compilée pour Linux ne convient pas."
            exit 1
          fi

          file "$THEOS/vendor/lib/libdobby.a"

      - name: Compile BitSwag
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload BitSwag package
        uses: actions/upload-artifact@v4
        with:
          name: BitSwag-deb
          path: packages/*.deb
          if-no-files-found: error
